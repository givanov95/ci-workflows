name: Actions self-test

# Runs the composite actions (.github/actions/*) from this checkout, and board-sync.yml, which
# checks out and runs the board-sync action of its own commit. This is this repo's own CI, not a
# reusable workflow. The board-sync cases run without a board token, so nothing is moved; the
# deploy-release cases only check a version.json served on localhost (release: 'false'); skip-if-tested
# only reads the runs of this workflow (on a pull request it must say 'false').
on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/actions-self-test.yml
      - .github/workflows/board-sync.yml
  push:
    branches: [main]
    paths:
      - .github/actions/**
      - .github/workflows/actions-self-test.yml
      - .github/workflows/board-sync.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Composite actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # skip-if-tested reads runs (actions), commit trees (contents) and the merged PR (pull-requests)
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a push to main after a PR that was up to date, this is the live check that it finds the
      # PR's run (see its reason in the log). A consumer runs it before the checkout.
      - name: skip-if-tested — this workflow
        id: tested
        uses: ./.github/actions/skip-if-tested

      - name: health-check — a healthy URL
        id: ok
        uses: ./.github/actions/health-check
        with:
          url: https://github.com
          attempts: 2
          interval: 1

      - name: health-check — another expected status
        id: expected
        uses: ./.github/actions/health-check
        with:
          url: https://github.com/givanov95/ci-workflows/this-page-does-not-exist
          expected-status: '404'
          attempts: 2
          interval: 1

      - name: health-check — soft, unhealthy
        id: soft
        uses: ./.github/actions/health-check
        with:
          url: https://github.com/givanov95/ci-workflows/this-page-does-not-exist
          attempts: 2
          interval: 1
          soft: true

      - name: health-check — hard, unhealthy (must fail)
        id: hard
        continue-on-error: true
        uses: ./.github/actions/health-check
        with:
          url: https://github.com/givanov95/ci-workflows/this-page-does-not-exist
          attempts: 1

      - name: board-sync — no token is a green no-op
        uses: ./.github/actions/board-sync
        with:
          project-number: 1

      # add mode is a side task: no key, or no token at all, is a notice (green), never a failure
      - name: board-sync — add mode without a token is a green no-op
        uses: ./.github/actions/board-sync
        with:
          project-number: 1
          issue: 1
          column: New
          priority: P2

      - name: board-sync — add mode, an App id without its key is a green no-op
        uses: ./.github/actions/board-sync
        with:
          project-number: 1
          issue: 1
          app-client-id: Iv00000000000000000

      # A Dependabot run (e.g. a PR that bumps a pin in this file) is a green no-op instead.
      - name: board-sync — an App id without its key (must fail)
        id: nokey
        continue-on-error: true
        uses: ./.github/actions/board-sync
        with:
          project-number: 1
          app-client-id: Iv00000000000000000

      # deploy-release against a local version.json (release: 'false' - this job writes nothing)
      - name: deploy-release — serve a version.json
        run: |
          mkdir -p "$RUNNER_TEMP/site/ok" "$RUNNER_TEMP/site/unknown"
          printf '{"sha":"%s"}' "${GITHUB_SHA:0:7}" > "$RUNNER_TEMP/site/ok/version.json"
          printf '{"sha":"%s"}' 0000000 > "$RUNNER_TEMP/site/unknown/version.json"
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > /dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8765/ok/version.json

      - name: deploy-release — the site runs this commit
        id: version_ok
        uses: ./.github/actions/deploy-release
        with:
          version-url: http://127.0.0.1:8765/ok/version.json
          release: 'false'

      - name: deploy-release — the site runs an unknown commit (must fail)
        id: version_unknown
        continue-on-error: true
        uses: ./.github/actions/deploy-release
        with:
          version-url: http://127.0.0.1:8765/unknown/version.json
          release: 'false'

      - name: deploy-release — no version.json (must fail)
        id: version_missing
        continue-on-error: true
        uses: ./.github/actions/deploy-release
        with:
          version-url: http://127.0.0.1:8765/missing/version.json
          release: 'false'

      # wireguard-connect: the refusals first (they fail before anything is installed - wg_after checks
      # that none of their interfaces exists), then a peer that never answers (this installs
      # wireguard-tools on the clean runner), a split default route (refused after bring-up), then a
      # real server: a WireGuard interface in a network namespace on this runner, over a veth pair.
      - name: wireguard-connect — a malformed key (must fail)
        id: wg_bad_key
        continue-on-error: true
        uses: ./.github/actions/wireguard-connect
        with:
          config: |
            [Interface]
            PrivateKey = AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAx=
            Address = 10.66.9.10/32
            [Peer]
            PublicKey = ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0A=
            Endpoint = 192.0.2.2:51820
            AllowedIPs = 10.66.9.1/32
          ping: 10.66.9.1
          interface: wg-badkey

      - name: wireguard-connect — default route in AllowedIPs (must fail)
        id: wg_default_route
        continue-on-error: true
        uses: ./.github/actions/wireguard-connect
        with:
          config: |
            [Interface]
            PrivateKey = AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
            Address = 10.66.9.10/32
            [Peer]
            PublicKey = ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0A=
            Endpoint = 192.0.2.2:51820
            AllowedIPs = 10.66.9.1/32, 0.0.0.0/0
          ping: 10.66.9.1
          interface: wg-route

      - name: wireguard-connect — DNS line (must fail)
        id: wg_dns
        continue-on-error: true
        uses: ./.github/actions/wireguard-connect
        with:
          config: |
            [Interface]
            PrivateKey = AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
            Address = 10.66.9.10/32
            DNS = 1.1.1.1
            [Peer]
            PublicKey = ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0A=
            Endpoint = 192.0.2.2:51820
            AllowedIPs = 10.66.9.1/32
          ping: 10.66.9.1
          interface: wg-dns

      - name: wireguard-connect — a peer that never answers (must fail)
        id: wg_silent
        continue-on-error: true
        uses: ./.github/actions/wireguard-connect
        with:
          config: |
            [Interface]
            PrivateKey = AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
            Address = 10.66.8.10/32
            [Peer]
            PublicKey = ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0A=
            Endpoint = 127.0.0.1:51899
            AllowedIPs = 10.66.8.1/32
          ping: 10.66.8.1
          attempts: '3'
          interface: wg-silent

      - name: wireguard-connect — a split default route (must fail, interface removed)
        id: wg_split
        continue-on-error: true
        uses: ./.github/actions/wireguard-connect
        with:
          config: |
            [Interface]
            PrivateKey = AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA=
            Address = 10.66.7.10/32
            [Peer]
            PublicKey = ISIjJCUmJygpKissLS4vMDEyMzQ1Njc4OTo7PD0+P0A=
            Endpoint = 127.0.0.1:51898
            AllowedIPs = 0.0.0.0/1, 128.0.0.0/1
          ping: 10.66.7.1
          attempts: '1'
          interface: wg-split

      - name: wireguard-connect — start a server in a network namespace
        id: wg_server
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/wg"; mkdir -p "$d"
          wg genkey > "$d/client.key"
          echo "::add-mask::$(cat "$d/client.key")"   # a throwaway key, but keep the habit
          # wg cannot fopen a key file in RUNNER_TEMP, even as root (fopen: Permission denied):
          # the server key is made and read in /etc/wireguard
          sudo install -d -m 700 /etc/wireguard
          sudo sh -c 'umask 077; wg genkey > /etc/wireguard/selftest-server.key'
          sudo ip netns add wgsrv
          sudo ip link add veth-wg type veth peer name veth-wgsrv
          sudo ip link set veth-wgsrv netns wgsrv
          sudo ip addr add 192.0.2.1/24 dev veth-wg && sudo ip link set veth-wg up
          sudo ip -n wgsrv addr add 192.0.2.2/24 dev veth-wgsrv
          sudo ip -n wgsrv link set veth-wgsrv up && sudo ip -n wgsrv link set lo up
          sudo ip -n wgsrv link add wg0 type wireguard
          sudo ip netns exec wgsrv wg set wg0 listen-port 51820 private-key /etc/wireguard/selftest-server.key \
            peer "$(wg pubkey < "$d/client.key")" allowed-ips 10.66.9.10/32
          server_pub="$(sudo ip netns exec wgsrv wg show wg0 public-key)"
          sudo ip -n wgsrv addr add 10.66.9.1/24 dev wg0 && sudo ip -n wgsrv link set wg0 up
          {
            echo 'config<<WG_EOF'
            printf '[Interface]\nPrivateKey = %s\nAddress = 10.66.9.10/32\n\n' "$(cat "$d/client.key")"
            printf '[Peer]\nPublicKey = %s\nEndpoint = 192.0.2.2:51820\nAllowedIPs = 10.66.9.1/32\nPersistentKeepalive = 25\n' "$server_pub"
            echo 'WG_EOF'
          } >> "$GITHUB_OUTPUT"
          rm -f "$d/client.key"

      - name: wireguard-connect — the server answers through the tunnel
        id: wg_ok
        uses: ./.github/actions/wireguard-connect
        with:
          config: ${{ steps.wg_server.outputs.config }}
          ping: 10.66.9.1

      - name: wireguard-connect — the same interface again (must fail)
        id: wg_again
        continue-on-error: true
        uses: ./.github/actions/wireguard-connect
        with:
          config: ${{ steps.wg_server.outputs.config }}
          ping: 10.66.9.1

      - name: wireguard-connect — the config file is gone, the tunnel stays, the refusals left nothing
        id: wg_after
        run: |
          set -euo pipefail
          if sudo test -e /etc/wireguard/wg0.conf; then echo "::error::/etc/wireguard/wg0.conf is still there"; exit 1; fi
          ping -c 1 -W 2 10.66.9.1 >/dev/null
          ! ip route get 1.1.1.1 | grep -q 'dev wg' || { echo "::error::the internet goes through the tunnel"; exit 1; }
          for i in wg-badkey wg-route wg-dns wg-split; do
            ! ip link show "$i" >/dev/null 2>&1 || { echo "::error::$i exists - the refusal did not happen before bring-up (or the interface was not removed)"; exit 1; }
          done

      - name: Check the outcomes
        env:
          WG_BAD_KEY_OUTCOME: ${{ steps.wg_bad_key.outcome }}
          WG_SPLIT_OUTCOME: ${{ steps.wg_split.outcome }}
          WG_AGAIN_OUTCOME: ${{ steps.wg_again.outcome }}
          WG_ROUTE_OUTCOME: ${{ steps.wg_default_route.outcome }}
          WG_DNS_OUTCOME: ${{ steps.wg_dns.outcome }}
          WG_SILENT_OUTCOME: ${{ steps.wg_silent.outcome }}
          WG_OK_OUTCOME: ${{ steps.wg_ok.outcome }}
          WG_SECONDS: ${{ steps.wg_ok.outputs.seconds }}
          OK: ${{ steps.ok.outputs.healthy }}
          EXPECTED: ${{ steps.expected.outputs.healthy }}
          SOFT: ${{ steps.soft.outputs.healthy }}
          SOFT_OUTCOME: ${{ steps.soft.outcome }}
          HARD_OUTCOME: ${{ steps.hard.outcome }}
          HARD: ${{ steps.hard.outputs.healthy }}
          NOKEY_OUTCOME: ${{ steps.nokey.outcome }}
          VERSION_SHA: ${{ steps.version_ok.outputs.sha }}
          VERSION_RELEASE: ${{ steps.version_ok.outputs.release }}
          VERSION_TAG: ${{ steps.version_ok.outputs.tag }}
          UNKNOWN_OUTCOME: ${{ steps.version_unknown.outcome }}
          MISSING_OUTCOME: ${{ steps.version_missing.outcome }}
          TESTED_SKIP: ${{ steps.tested.outputs.skip }}
          TESTED_REASON: ${{ steps.tested.outputs.reason }}
          TESTED_WANT: ${{ github.event_name == 'push' && 'true or false' || 'false' }}
          NOKEY_WANT: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') && 'success' || 'failure' }}
        run: |
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "ok   $1 = $2"; else echo "FAIL $1 = '$2', expected '$3'"; fail=1; fi; }
          check "healthy URL"             "$OK" true
          check "expected 404"            "$EXPECTED" true
          check "soft: healthy"           "$SOFT" false
          check "soft: step outcome"      "$SOFT_OUTCOME" success
          check "hard: step outcome"      "$HARD_OUTCOME" failure
          check "hard: healthy"           "$HARD" false
          check "board: App id, no key"   "$NOKEY_OUTCOME" "$NOKEY_WANT"
          check "release: sha"            "$VERSION_SHA" "$GITHUB_SHA"
          check "release: skipped"        "$VERSION_RELEASE" skipped
          check "release: no tag"         "$VERSION_TAG" ''
          check "release: unknown commit" "$UNKNOWN_OUTCOME" failure
          check "release: no version"     "$MISSING_OUTCOME" failure
          check "wireguard: malformed key" "$WG_BAD_KEY_OUTCOME" failure
          check "wireguard: split route"   "$WG_SPLIT_OUTCOME" failure
          check "wireguard: same iface"    "$WG_AGAIN_OUTCOME" failure
          check "wireguard: default route" "$WG_ROUTE_OUTCOME" failure
          check "wireguard: DNS line"      "$WG_DNS_OUTCOME" failure
          check "wireguard: silent peer"   "$WG_SILENT_OUTCOME" failure
          check "wireguard: server"        "$WG_OK_OUTCOME" success
          [[ "$WG_SECONDS" =~ ^[0-9]+$ ]] || { echo "FAIL wireguard: seconds = '$WG_SECONDS'"; fail=1; }
          echo "wireguard-connect: up in ${WG_SECONDS}s (this runner had wireguard-tools from the silent-peer case)"
          echo "skip-if-tested: skip=$TESTED_SKIP ($TESTED_REASON)"
          case "$TESTED_WANT" in
            false) check "skip-if-tested: not a push" "$TESTED_SKIP" false ;;
            *) [[ "$TESTED_SKIP" =~ ^(true|false)$ ]] || { echo "FAIL skip-if-tested: skip = '$TESTED_SKIP'"; fail=1; }
               # a broken lookup (endpoint, permission, filter) shows as a GitHub error, not as "no run"
               [[ "$TESTED_REASON" != "GitHub error"* ]] || { echo "FAIL skip-if-tested: $TESTED_REASON"; fail=1; } ;;
          esac
          exit "$fail"

  # board-sync.yml checks out the action from its own commit (job.workflow_sha) and runs it. Without
  # a token that is a green no-op, so this job proves the checkout and the wiring work.
  board-sync-workflow:
    name: board-sync.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/board-sync.yml
    with:
      project-number: 1

  # The add-mode inputs reach the action through board-sync.yml (no token: a green no-op).
  board-sync-workflow-add:
    name: board-sync.yml (add mode)
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/board-sync.yml
    with:
      project-number: 1
      issue: '1'
      column: New
      priority: P2
