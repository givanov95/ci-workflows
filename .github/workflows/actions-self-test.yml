name: Actions self-test

# Runs the composite actions (.github/actions/*) from this checkout, and board-sync.yml, which
# checks out and runs the board-sync action of its own commit. This is this repo's own CI, not a
# reusable workflow. The board-sync cases run without a board token, so nothing is moved; the
# deploy-release cases only check a version.json served on localhost (release: 'false').
on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/workflows/actions-self-test.yml
      - .github/workflows/board-sync.yml
  push:
    branches: [main]
    paths:
      - .github/actions/**
      - .github/workflows/actions-self-test.yml
      - .github/workflows/board-sync.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    name: Composite actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: health-check — a healthy URL
        id: ok
        uses: ./.github/actions/health-check
        with:
          url: https://github.com
          attempts: 2
          interval: 1

      - name: health-check — another expected status
        id: expected
        uses: ./.github/actions/health-check
        with:
          url: https://github.com/givanov95/ci-workflows/this-page-does-not-exist
          expected-status: '404'
          attempts: 2
          interval: 1

      - name: health-check — soft, unhealthy
        id: soft
        uses: ./.github/actions/health-check
        with:
          url: https://github.com/givanov95/ci-workflows/this-page-does-not-exist
          attempts: 2
          interval: 1
          soft: true

      - name: health-check — hard, unhealthy (must fail)
        id: hard
        continue-on-error: true
        uses: ./.github/actions/health-check
        with:
          url: https://github.com/givanov95/ci-workflows/this-page-does-not-exist
          attempts: 1

      - name: board-sync — no token is a green no-op
        uses: ./.github/actions/board-sync
        with:
          project-number: 1

      # A Dependabot run (e.g. a PR that bumps a pin in this file) is a green no-op instead.
      - name: board-sync — an App id without its key (must fail)
        id: nokey
        continue-on-error: true
        uses: ./.github/actions/board-sync
        with:
          project-number: 1
          app-client-id: Iv00000000000000000

      # deploy-release against a local version.json (release: 'false' - this job writes nothing)
      - name: deploy-release — serve a version.json
        run: |
          mkdir -p "$RUNNER_TEMP/site/ok" "$RUNNER_TEMP/site/unknown"
          printf '{"sha":"%s"}' "${GITHUB_SHA:0:7}" > "$RUNNER_TEMP/site/ok/version.json"
          printf '{"sha":"%s"}' 0000000 > "$RUNNER_TEMP/site/unknown/version.json"
          nohup python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" > /dev/null 2>&1 &
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:8765/ok/version.json

      - name: deploy-release — the site runs this commit
        id: version_ok
        uses: ./.github/actions/deploy-release
        with:
          version-url: http://127.0.0.1:8765/ok/version.json
          release: 'false'

      - name: deploy-release — the site runs an unknown commit (must fail)
        id: version_unknown
        continue-on-error: true
        uses: ./.github/actions/deploy-release
        with:
          version-url: http://127.0.0.1:8765/unknown/version.json
          release: 'false'

      - name: deploy-release — no version.json (must fail)
        id: version_missing
        continue-on-error: true
        uses: ./.github/actions/deploy-release
        with:
          version-url: http://127.0.0.1:8765/missing/version.json
          release: 'false'

      - name: Check the outcomes
        env:
          OK: ${{ steps.ok.outputs.healthy }}
          EXPECTED: ${{ steps.expected.outputs.healthy }}
          SOFT: ${{ steps.soft.outputs.healthy }}
          SOFT_OUTCOME: ${{ steps.soft.outcome }}
          HARD_OUTCOME: ${{ steps.hard.outcome }}
          HARD: ${{ steps.hard.outputs.healthy }}
          NOKEY_OUTCOME: ${{ steps.nokey.outcome }}
          VERSION_SHA: ${{ steps.version_ok.outputs.sha }}
          VERSION_RELEASE: ${{ steps.version_ok.outputs.release }}
          VERSION_TAG: ${{ steps.version_ok.outputs.tag }}
          UNKNOWN_OUTCOME: ${{ steps.version_unknown.outcome }}
          MISSING_OUTCOME: ${{ steps.version_missing.outcome }}
          NOKEY_WANT: ${{ (github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]') && 'success' || 'failure' }}
        run: |
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "ok   $1 = $2"; else echo "FAIL $1 = '$2', expected '$3'"; fail=1; fi; }
          check "healthy URL"             "$OK" true
          check "expected 404"            "$EXPECTED" true
          check "soft: healthy"           "$SOFT" false
          check "soft: step outcome"      "$SOFT_OUTCOME" success
          check "hard: step outcome"      "$HARD_OUTCOME" failure
          check "hard: healthy"           "$HARD" false
          check "board: App id, no key"   "$NOKEY_OUTCOME" "$NOKEY_WANT"
          check "release: sha"            "$VERSION_SHA" "$GITHUB_SHA"
          check "release: skipped"        "$VERSION_RELEASE" skipped
          check "release: no tag"         "$VERSION_TAG" ''
          check "release: unknown commit" "$UNKNOWN_OUTCOME" failure
          check "release: no version"     "$MISSING_OUTCOME" failure
          exit "$fail"

  # board-sync.yml checks out the action from its own commit (job.workflow_sha) and runs it. Without
  # a token that is a green no-op, so this job proves the checkout and the wiring work.
  board-sync-workflow:
    name: board-sync.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/board-sync.yml
    with:
      project-number: 1
