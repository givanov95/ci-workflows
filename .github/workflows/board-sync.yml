name: Board sync

# Moves the cards of the issues a PR / push refers to on a GitHub Project board.
#
#   pull_request opened / reopened / ready_for_review -> In review
#   pull_request merged into `dev`                    -> Ready to ship
#   push to `staging`  (only if staging-environment)  -> Staging / QA
#   push to `main`                                    -> Done
#
# Issues are read from `Fixes|Closes|Resolves #N` in the PR (title, body, commits) or in the
# pushed commits. Cards only ever move FORWARD (New < Backlog < Ready < In progress < In review
# < Ready to ship < Staging / QA < Done), so a re-run or an out-of-order event is harmless.
#
# The default GITHUB_TOKEN cannot reach any Project board, so one of two tokens is needed:
#
#   * GitHub App (recommended; the board must be owned by an ORGANIZATION). Pass `app-client-id`
#     and the App's private key as the BOARD_APP_KEY secret. A short-lived installation token (1 hour,
#     revoked after the job) is minted for the board owner with only Organization projects: write and
#     Issues / Pull requests: read. It takes precedence over PROJECT_TOKEN when both are present.
#   * PROJECT_TOKEN (legacy; the only option for a USER-owned board): a classic PAT, scope `project`,
#     plus `repo` when the board holds issues of PRIVATE repositories (a project-only token cannot
#     see those issues).
#
# Without either the workflow does nothing and stays green.
# Columns are found by NAME (emoji ignored): In review, Ready to ship (or Ready for Testing),
# Staging / QA (or Staging), Done.

on:
  workflow_call:
    inputs:
      project-number:
        description: Number of the Project board (the N in .../projects/N).
        type: number
        required: true
      project-owner:
        description: User or organization that owns the board. Defaults to the repository owner.
        type: string
        default: ''
      staging-environment:
        description: Set true only if pushes to `staging` deploy a real staging environment.
        type: boolean
        default: false
      app-client-id:
        description: Client ID of the GitHub App that moves the cards (needs the BOARD_APP_KEY secret). Leave empty to use PROJECT_TOKEN.
        type: string
        default: ''
    secrets:
      BOARD_APP_KEY:
        description: Private key (PEM) of the GitHub App named by `app-client-id`.
        required: false
      PROJECT_TOKEN:
        description: Legacy - classic PAT, scope `project`, plus `repo` for private repositories.
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync:
    name: Move cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_CLIENT_ID: ${{ inputs.app-client-id }}
      HAS_APP_KEY: ${{ secrets.BOARD_APP_KEY != '' }}
    steps:
      - name: Check the GitHub App configuration
        if: ${{ env.APP_CLIENT_ID != '' && env.HAS_APP_KEY != 'true' }}
        run: |
          echo "::error title=Board sync::app-client-id is set but the BOARD_APP_KEY secret is missing (pass it with secrets: BOARD_APP_KEY)."
          exit 1

      - name: Create a GitHub App installation token
        id: app
        if: ${{ env.APP_CLIENT_ID != '' && env.HAS_APP_KEY == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.BOARD_APP_KEY }}
          owner: ${{ inputs.project-owner != '' && inputs.project-owner || github.repository_owner }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Work out the target column and move the cards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ steps.app.outputs.token || secrets.PROJECT_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PROJECT_NUMBER: ${{ inputs.project-number }}
          PROJECT_OWNER: ${{ inputs.project-owner }}
          STAGING_ENV: ${{ inputs.staging-environment }}
        run: |
          set -euo pipefail
          notice() { echo "::notice title=Board sync::$*"; }

          if [ -z "${PROJECT_TOKEN:-}" ]; then
            notice "No board token (neither a GitHub App via app-client-id + BOARD_APP_KEY nor PROJECT_TOKEN) - skipping (no cards moved)."
            exit 0
          fi

          # ---- 1. what happened -> target column + the text to search for issue refs ----
          TEXT=""
          case "$EVENT_NAME" in
            pull_request)
              if { [ "$PR_ACTION" = opened ] || [ "$PR_ACTION" = reopened ] || [ "$PR_ACTION" = ready_for_review ]; } \
                 && [ "$PR_DRAFT" != true ]; then
                TARGET="in review"
              elif [ "$PR_ACTION" = closed ] && [ "$PR_MERGED" = true ] && [ "$PR_BASE" = dev ]; then
                TARGET="ready to ship"
              else
                notice "pull_request $PR_ACTION (base $PR_BASE, draft=$PR_DRAFT) - nothing to do."; exit 0
              fi
              TEXT="$(jq -r '.pull_request.title // "", .pull_request.body // ""' "$GITHUB_EVENT_PATH")"
              TEXT="$TEXT"$'\n'"$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" --jq '.[].commit.message' 2>/dev/null || true)"
              ;;
            push)
              case "$REF_NAME" in
                main) TARGET="done" ;;
                staging)
                  if [ "$STAGING_ENV" != true ]; then notice "no staging environment - skipping."; exit 0; fi
                  TARGET="staging" ;;
                *) notice "push to $REF_NAME - nothing to do."; exit 0 ;;
              esac
              if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                TEXT="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message')"
              else
                TEXT="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.commits[].commit.message' 2>/dev/null \
                        || gh api "repos/$REPO/commits/$SHA" --jq '.commit.message')"
              fi
              ;;
            *) notice "event $EVENT_NAME is not handled."; exit 0 ;;
          esac

          ISSUES="$(printf '%s\n' "$TEXT" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+#[0-9]+' | grep -oE '[0-9]+$' | sort -un || true)"
          if [ -z "$ISSUES" ]; then notice "no Fixes/Closes/Resolves #N found - nothing to move."; exit 0; fi

          # ---- 2. the board, its Status field and the target option (by name) ----
          OWNER="${PROJECT_OWNER:-$REPO_OWNER}"
          norm() { tr '[:upper:]' '[:lower:]' | sed -E 's/[^[:alnum:] ]+/ /g; s/ +/ /g; s/^ //; s/ $//'; }
          rank() { # normalized column name -> flow rank (-1 = unknown)
            case "$1" in
              new) echo 0;; backlog) echo 1;; ready|planned) echo 2;; "in progress") echo 3;;
              "in review") echo 4;; "ready to ship"|"ready for testing") echo 5;;
              staging|"staging qa") echo 6;; done) echo 7;; *) echo -1;;
            esac
          }
          gql() { GH_TOKEN="$PROJECT_TOKEN" gh api graphql "$@"; }

          BOARD="$(gql -f o="$OWNER" -F n="$PROJECT_NUMBER" -f query='
            query($o:String!,$n:Int!){repositoryOwner(login:$o){
              ... on User{projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}
              ... on Organization{projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}}')"
          PROJECT_ID="$(echo "$BOARD" | jq -r '.data.repositoryOwner.projectV2.id // empty')"
          FIELD_ID="$(echo "$BOARD" | jq -r '.data.repositoryOwner.projectV2.field.id // empty')"
          [ -n "$PROJECT_ID" ] && [ -n "$FIELD_ID" ] || { echo "::error::Project #$PROJECT_NUMBER of $OWNER or its Status field was not found (check the GitHub App installation / PROJECT_TOKEN and the project number)."; exit 1; }

          OPTION_ID=""
          while IFS=$'\t' read -r id name; do
            n="$(printf '%s' "$name" | norm)"
            if [ "$n" = "$TARGET" ] || { [ "$TARGET" = "ready to ship" ] && [ "$n" = "ready for testing" ]; } \
               || { [ "$TARGET" = staging ] && { [ "$n" = "staging qa" ] || [ "$n" = staging ]; }; }; then
              OPTION_ID="$id"; break
            fi
          done < <(echo "$BOARD" | jq -r '.data.repositoryOwner.projectV2.field.options[]|[.id,.name]|@tsv')
          [ -n "$OPTION_ID" ] || { echo "::error::No '$TARGET' column on the board."; exit 1; }
          TARGET_RANK="$(rank "$TARGET")"

          # ---- 3. move every referenced card forward ----
          RC=0
          for N in $ISSUES; do
            NODE_ID="$(gh api "repos/$REPO/issues/$N" --jq 'select(.pull_request|not)|.node_id' 2>/dev/null || true)"
            if [ -z "$NODE_ID" ]; then notice "#$N is not an issue of $REPO - skipped."; continue; fi

            # idempotent: returns the existing card when the issue is already on the board
            ITEM="$(gql -f p="$PROJECT_ID" -f c="$NODE_ID" -f query='
              mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id
                status:fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}' 2>&1)" || {
              echo "::error::Could not add the card of #$N. If this says 'Could not resolve to a node', the token cannot see the issue: a GitHub App needs Issues and Pull requests (read) on the repository, a classic PAT needs the scope repo as well as project."
              echo "$ITEM" | head -3; RC=1; continue; }
            ITEM_ID="$(echo "$ITEM" | jq -r '.data.addProjectV2ItemById.item.id // empty')"
            [ -n "$ITEM_ID" ] || { echo "::error::Could not add/find the card of #$N."; RC=1; continue; }
            CUR="$(echo "$ITEM" | jq -r '.data.addProjectV2ItemById.item.status.name // ""')"

            if [ -z "$CUR" ]; then
              # just added: the board's own "Item added" workflow sets New a moment later - let it finish first
              sleep 8
              CUR="$(gql -f i="$ITEM_ID" -f query='query($i:ID!){node(id:$i){... on ProjectV2Item{status:fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}' \
                     | jq -r '.data.node.status.name // ""')"
            fi

            CUR_RANK="$(rank "$(printf '%s' "$CUR" | norm)")"
            if [ "$CUR_RANK" -ge "$TARGET_RANK" ]; then
              notice "#$N stays in '$CUR' (already at or past '$TARGET')."; continue
            fi
            gql -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$FIELD_ID" -f o="$OPTION_ID" -f query='
              mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' >/dev/null
            echo "#$N: '${CUR:-none}' -> '$TARGET'"
          done
          exit "$RC"
