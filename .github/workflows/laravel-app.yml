name: Laravel App CI

# Reusable workflow for Laravel + Inertia/Vite applications.
# Call it from a project with:
#
#   jobs:
#     ci:
#       uses: givanov95/ci-workflows/.github/workflows/laravel-app.yml@v1
#
on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version to test on.
        type: string
        default: '8.4'
      node-version:
        description: Node version used for the asset build.
        type: string
        default: '20'
      build:
        description: Run the Vite build (npm ci + npm run build).
        type: boolean
        default: true
      run-tests:
        description: Run the test suite (php artisan test).
        type: boolean
        default: true
      timeout-minutes:
        description: Cancel the job if it runs longer than this.
        type: number
        default: 60

# The called job only reads the repository; the caller's token is never raised above that.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ inputs.php-version }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
          php artisan key:generate

      - name: Setup Node
        if: ${{ inputs.build }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Build assets
        if: ${{ inputs.build }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - name: Run tests
        if: ${{ inputs.run-tests }}
        run: php artisan test
