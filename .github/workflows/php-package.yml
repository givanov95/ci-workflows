name: PHP Package CI

# Reusable workflow for PHP packages/libraries (PHPUnit, optional PHPStan).
# Call it from a project with:
#
#   jobs:
#     ci:
#       uses: givanov95/ci-workflows/.github/workflows/php-package.yml@v1
#       with:
#         php-versions: '["8.3", "8.4"]'
#         phpstan: true
#
on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON array of PHP versions to test against (matrix).
        type: string
        default: '["8.3", "8.4"]'
      phpstan:
        description: Run PHPStan (vendor/bin/phpstan analyse).
        type: boolean
        default: false
      test-command:
        description: Command used to run the test suite.
        type: string
        default: 'vendor/bin/phpunit'
      timeout-minutes:
        description: Cancel a matrix job that runs longer than this.
        type: number
        default: 30

# The called jobs only read the repository; the caller's token is never raised above that.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan
        if: ${{ inputs.phpstan }}
        run: vendor/bin/phpstan analyse --no-progress --no-interaction

      - name: Run tests
        run: ${{ inputs.test-command }}
